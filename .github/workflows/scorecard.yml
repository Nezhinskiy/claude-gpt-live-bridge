# OpenSSF Scorecard: an automated check of how this repository is run (pinned actions, token
# permissions, branch rules, static analysis, signed releases and more), scored 0 to 10 and shown
# as the README's badge. It rates practices, not the code itself, so it is not a security audit.
# Publishing the result is what feeds the badge, and Scorecard's API then accepts only a workflow
# shaped like this one: no top-level env or defaults, no workflow-level write permission, an
# Ubuntu runner and only its listed actions in the job. It runs on main only, where it publishes.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # the SARIF upload to code scanning
      id-token: write         # publishing the result for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
