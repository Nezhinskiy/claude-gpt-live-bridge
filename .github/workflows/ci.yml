# Runs scripts/check.sh on every pull request and every push to main. Claude Code is installed first, so the
# mod's engine-facing half is type-checked against its API types and run by `claude plugin test`.
# Then scripts/check-floor.sh runs that half again on the lowest version the README promises.
# A pull request that changes only documents skips that long job's steps
# (scripts/ci-documents-only.sh). The workflow still runs, because main requires the `check`
# status: GitHub waits forever for a job in a workflow that never started.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Documents only?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documents-only: ${{ steps.diff.outputs.documents-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # a pull request's merge commit and the base it merges into
          persist-credentials: false
      - id: diff
        run: |
          if sh scripts/ci-documents-only.sh HEAD^1 HEAD; then
            echo "documents-only=true" >>"$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    # GitHub counts a job its own condition skipped as passed, so this one always runs and decides
    # inside. On a pull request it fails unless `changes` succeeded, and it fails a cancelled run;
    # for a documents-only change it skips the suite's steps and passes, on a Linux runner. Any
    # answer but yes runs the suite.
    if: ${{ always() }}
    # The Xcode 27 image (macOS 27, arm64; a public preview in actions/runner-images).
    runs-on: ${{ (github.event_name != 'pull_request' || needs.changes.result == 'success' && needs.changes.outputs.documents-only != 'true') && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      ANSWER: ${{ github.event_name == 'pull_request' && needs.changes.result || 'success' }}
      SUITE: ${{ needs.changes.outputs.documents-only != 'true' }}
    steps:
      - name: Require the documents-only answer
        run: test "$ANSWER" = success || { echo "Documents only? ended $ANSWER; run CI again."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SUITE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SUITE == 'true'
        with:
          node-version: '26'
      - name: Install Claude Code
        if: env.SUITE == 'true'
        # Pinned by version and hash in .github/claude-code: its API types and its test kit are what
        # the mod is checked against. No login is needed for validate, test, or the mod's own
        # command that lays the types.
        run: |
          npm ci --prefix .github/claude-code --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/claude-code/node_modules/.bin" >>"$GITHUB_PATH"
      - name: Select Xcode 27.2
        if: env.SUITE == 'true'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Show the toolchain
        if: env.SUITE == 'true'
        run: |
          xcodebuild -version
          swift --version
          node --version
          claude --version
      - name: Check
        if: env.SUITE == 'true'
        run: scripts/check.sh
      - name: Check the mod on the lowest Claude Code the README promises
        if: env.SUITE == 'true'
        # The version comes from README.md, so the two cannot differ.
        run: scripts/check-floor.sh
      - name: Fail a cancelled run
        # A step skipped by the cancel would otherwise leave the job passed.
        if: ${{ cancelled() }}
        run: exit 1
