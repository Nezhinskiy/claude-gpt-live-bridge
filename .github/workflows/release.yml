# Builds the disk image on a version tag (v0.1.0 and on), attaches it to that tag's GitHub
# Release and attests its build provenance, so a downloader can check with
# `gh attestation verify LiveBridge.dmg --repo getLiveBridge/livebridge` that this workflow built
# it from the tagged commit. The image is signed ad hoc and not notarized; no secret is used.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: xcode-27  # the same image as ci.yml, so the release builds with the tested toolchain
    timeout-minutes: 30
    permissions:
      contents: write # create the Release and upload the image
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check the tag names the app's version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw app/Support/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME but Info.plist says $version" >&2
            exit 1
          fi
      - name: Package
        run: scripts/build-app.sh --package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LiveBridge.dmg
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/LiveBridge.dmg --verify-tag --generate-notes
