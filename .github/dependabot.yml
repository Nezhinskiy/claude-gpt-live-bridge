# Weekly update PRs for the SHA-pinned actions of the workflows and the mod's development
# dependencies. The app has no Swift package dependencies. The two Claude Code lockfiles under
# .github/ are left out on purpose: CI's version is picked by hand and the floor must not move, so
# a security PR against the floor is expected to fail its check, and its alert is dismissed.
# A new version waits a week before it is proposed, so a release that is pulled soon after
# publication never reaches a PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
