name: Bug report
description: Something in LiveBridge (the app or the livebridge mod) does not work as the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A vulnerability goes to a private report instead, as SECURITY.md
        says, not here. Before you paste anything below, remove what you would not publish:
        session titles, folder paths, conversation lines, tokens.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac, or `sw_vers -productVersion`.
      placeholder: "15.4"
    validations:
      required: true
  - type: input
    id: livebridge
    attributes:
      label: LiveBridge commit or version
      description: "`git rev-parse --short HEAD` in your clone of this repository, or the release tag you built."
      placeholder: "abc1234"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: "`claude --version`. Say if you use the Claude desktop app or the terminal."
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: codex version
      description: "`codex --version`."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, from `/live on` or Start, one step per line.
      placeholder: |
        1. /live on in a session
        2. Start in the band
        3. Asked the voice to ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What the menu or the band showed
      description: The call's state, the problem sentence if there was one, and any error, word for word.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        The app's log for the last minutes, after you remove anything personal:
        `/usr/bin/log show --last 10m --info --predicate 'subsystem == "com.getlivebridge.livebridge"'`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and the README's known limitations for this.
          required: true
        - label: I removed personal data from everything above.
          required: true
