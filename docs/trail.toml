# The forward track in machine-readable form, maintained by hand beside the roadmap. One theme
# to start with, matching everything; split it as the corpus grows. A document entering the
# listing declares its state here — `delivered` included, because a design is written before
# the thing is built.
[[theme]]
label = "Everything"
pattern = ".*"

[states]
"specs/2026-11-02-in-app-update-design.md" = "delivered"
"plans/2026-11-02-in-app-update.md" = "delivered"
"specs/2026-11-04-voice-session-context-design.md" = "delivered in part"
"plans/2026-11-04-voice-session-context.md" = "delivered in part"
