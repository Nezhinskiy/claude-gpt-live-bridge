<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 36" width="392" height="72" role="img" aria-labelledby="title">
  <title id="title">LiveBridge</title>
  <!-- The Span mark: nine bars on a bridge deck tracing one suspension span, then the wordmark. -->
  <style>
    .mark { fill: #0B7A85 }
    .word { fill: #15181C; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -0.3px }
    @media (prefers-color-scheme: dark) { .mark { fill: #5FD3DC } .word { fill: #F4F5F7 } }
  </style>
  <g class="mark" transform="translate(2 2) scale(1.8)">
    <rect x="1" y="13.6" width="22" height="2.6" rx="1.3"/>
    <rect x="1.20" y="9.20" width="1.6" height="4.80" rx="0.8"/>
    <rect x="3.70" y="0.80" width="1.6" height="13.20" rx="0.8"/>
    <rect x="6.20" y="7.49" width="1.6" height="6.51" rx="0.8"/>
    <rect x="8.70" y="10.42" width="1.6" height="3.58" rx="0.8"/>
    <rect x="11.20" y="11.40" width="1.6" height="2.60" rx="0.8"/>
    <rect x="13.70" y="10.42" width="1.6" height="3.58" rx="0.8"/>
    <rect x="16.20" y="7.49" width="1.6" height="6.51" rx="0.8"/>
    <rect x="18.70" y="0.80" width="1.6" height="13.20" rx="0.8"/>
    <rect x="21.20" y="9.20" width="1.6" height="4.80" rx="0.8"/>
  </g>
  <text class="word" x="54" y="27">LiveBridge</text>
</svg>
