# getlivebridge.com: the LiveBridge site, static files only. Served by an nginx whose certbot
# answers ACME challenges from /var/www/certbot; the files live in /var/www/extra-sites/.
server {
    listen 80;
    server_name getlivebridge.com www.getlivebridge.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://getlivebridge.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.getlivebridge.com;
    ssl_certificate     /etc/letsencrypt/live/getlivebridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getlivebridge.com/privkey.pem;
    return 301 https://getlivebridge.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name getlivebridge.com;
    ssl_certificate     /etc/letsencrypt/live/getlivebridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getlivebridge.com/privkey.pem;

    root /var/www/extra-sites/getlivebridge.com;
    index index.html;
    # No telemetry, and no record of visitors: no access log, no error for a missing file (which
    # would name the client's address), and only this server's critical errors.
    access_log off;
    log_not_found off;
    error_log /var/log/nginx/error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Nothing loads from another origin. The one inline script (the copy buttons) is allowed by
    # its SHA-256, so an edit to it needs the new hash here; the bars' styles are inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-HTG+GI/fiyvldJR4VKw2pFZRIU3ykSM8zalHbLhJHXg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
}
